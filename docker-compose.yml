version: "3.9"

services:
  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    env_file:
      - ./gateway/.env
    depends_on:
      - auth
      - user
      - house
      - search
      - payment
      - media
    environment:
      - AUTH_SERVICE_URL=http://auth:5001
      - USER_SERVICE_URL=http://user:5002
      - HOUSE_SERVICE_URL=http://house:5003
      - SEARCH_SERVICE_URL=http://search:5004
      - PAYMENT_SERVICE_URL=http://payment:5005
      - MEDIA_SERVICE_URL=http://media:5006
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}

  auth:
    build: ./auth-services
    env_file:
      - ./auth-services/.env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}

  user:
    build: ./user-services
    env_file:
      - ./user-services/.env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}

  house:
    build: ./house-services
    env_file:
      - ./house-services/.env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}

  search:
    build: ./search-services
    env_file:
      - ./search-services/.env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}

  payment:
    build: ./payment-services
    env_file:
      - ./payment-services/.env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}

  media:
    build: ./media-services
    env_file:
      - ./media-services/.env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN before starting Docker Compose}
